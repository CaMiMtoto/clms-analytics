services:

    app:
        build:
            context: .
        container_name: clms-app
        volumes:
            - .:/var/www/html


    nginx:
        image: nginx:latest
        container_name: clms-nginx
        ports:
            - "8080:80"
        volumes:
            - .:/var/www/html
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
